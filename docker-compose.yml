services:
  mysql:
    image: mysql:8.0
    container_name: mitron-mysql
    restart: always
    environment:
      MYSQL_DATABASE: game_java
      MYSQL_ROOT_PASSWORD: Mali9977$
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    networks:
      - mitron-net

  app:
    build: .
    container_name: mitron-app
    restart: always
    depends_on:
      - mysql
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/game_java?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&useUnicode=true&characterEncoding=UTF-8
      DB_USERNAME: root
      DB_PASSWORD: Mali9977$
      PORT: 8080
    networks:
      - mitron-net

volumes:
  mysql_data:

networks:
  mitron-net:
    driver: bridge

