spring.application.name=game-platform
server.port=${PORT:8080}

# Database (Defaults to embedded database so it runs anywhere without external cloud MySQL)
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/mitron;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=GamePlatformSuperSecretKeyThatIsAtLeast256BitsLong!2024
jwt.expiration=86400000

# Static resources
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**
