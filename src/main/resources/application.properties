spring.application.name=game-platform
server.port=${PORT:8080}

# Database (Embedded H2 file-based DB that runs inside the container without any cloud database)
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/mitron;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.h2.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# JWT
jwt.secret=GamePlatformSuperSecretKeyThatIsAtLeast256BitsLong!2024
jwt.expiration=86400000

# Static resources
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**
